<!doctype html>
<html>
<!-- The README banner. Render it with make.sh, which draws each frame here in Chromium. -->
<head>
<meta charset="utf-8">
<style>
/* Inter (SIL Open Font License); a local inter.woff2 is used first if present */
@font-face { font-family: Inter; src: url(inter.woff2) format('woff2'), url(https://fonts.gstatic.com/s/inter/v20/UcC73FwrK3iLTeHuS_nVMrMxCp50SjIa1ZL7.woff2) format('woff2'); font-weight: 100 900; }
:root { --bg: #0f241b; --ink: #f3f6f4; --tag: #c6ead7; --muted: #8db3a0; --accent: #1f9a65; }
html, body { margin: 0; background: var(--bg); }
#b { position: relative; width: 1280px; height: 400px; overflow: hidden; background: var(--bg); font-family: Inter, sans-serif; }
#b.social { height: 640px; }
.copy { position: absolute; left: 76px; top: 50%; transform: translateY(-50%); }
.brand { display: flex; align-items: center; gap: 26px; }
.brand svg { width: 92px; height: 92px; flex: none; }
.word { color: var(--ink); font-weight: 800; font-size: 108px; letter-spacing: -0.035em; line-height: 1; margin-top: -10px; }
.tag { color: var(--tag); font-weight: 600; font-size: 34px; letter-spacing: -0.01em; margin: 30px 0 0 2px; }
.sub { color: var(--muted); font-weight: 500; font-size: 22px; margin: 12px 0 0 2px; }
canvas { position: absolute; right: 0; top: 0; }
#b.social .brand svg { width: 104px; height: 104px; }
#b.social .word { font-size: 124px; }
#b.social .tag { font-size: 40px; margin-top: 34px; }
#b.social .sub { font-size: 25px; }
</style>
</head>
<body>
<div id="b">
  <canvas id="c"></canvas>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1f9a65"/><path d="M9 9v14h8M19 13l4 4-4 4" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="word">lessgif</div>
    </div>
    <div class="tag">Smaller animated GIFs.</div>
    <div class="sub">Encoder, desktop app and in-browser tools. Open source.</div>
  </div>
</div>
<script>
const social = new URLSearchParams(location.search).has('social');
const box = document.getElementById('b');
if (social) box.classList.add('social');
const H = social ? 640 : 400;
const cv = document.getElementById('c');
const W = social ? 480 : 560;
cv.width = W; cv.height = H;
const g = cv.getContext('2d');

// a mosaic of rounded "pixels" whose colour and size ripple diagonally; t in [0, 1) loops
const STEP = 40, TILE = 32;
const LEVELS = 10, SIZES = 4;
const cols = Math.floor(W / STEP), rows = Math.floor(H / STEP);
const stops = [[15, 36, 27], [22, 92, 64], [31, 154, 101], [76, 201, 140], [167, 232, 196], [255, 214, 120]];
function colour(v) { // v in [0, 1] along the palette
  const x = Math.min(stops.length - 1.0001, Math.max(0, v * (stops.length - 1)));
  const i = Math.floor(x), f = x - i, a = stops[i], b = stops[i + 1];
  return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * f)).join(',')})`;
}
function rr(x, y, s, r) { g.beginPath(); g.roundRect(x - s / 2, y - s / 2, s, s, r); g.fill(); }
window.render = (t) => {
  g.clearRect(0, 0, W, H);
  const ox = W - cols * STEP + STEP / 2;
  const oy = (H - rows * STEP) / 2 + STEP / 2;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = ox + c * STEP, y = oy + r * STEP;
    const u = c / (cols - 1), w = r / (rows - 1);
    // fade in from the left so the mosaic melts into the background behind the text
    const edge = Math.max(0, Math.min(1, (u - 0.04) / 0.55));
    const wave = 0.5 + 0.5 * Math.sin(2 * Math.PI * (t - 0.9 * u - 0.55 * w));
    const wave2 = 0.5 + 0.5 * Math.sin(2 * Math.PI * (2 * t + 0.6 * u - 1.1 * w) + 1.3);
    // colours and sizes move in steps, like a GIF palette: a tile only changes when it crosses one
    const q = (x, n) => Math.round(x * n) / n;
    const v = q(edge * (0.25 + 0.55 * wave + 0.2 * wave2 * wave), LEVELS);
    const s = TILE * (0.35 + 0.65 * q(Math.pow(edge, 0.6) * (0.55 + 0.45 * wave), SIZES));
    g.fillStyle = colour(v);
    rr(x, y, s, s * 0.22);
  }
};
window.render(0);
document.fonts.ready.then(() => { window.ready = true; });
</script>
</body>
</html>
