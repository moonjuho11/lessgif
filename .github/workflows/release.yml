# Builds the lessgif app for Windows, macOS and Linux, plus the browser build, and publishes them
# as a GitHub release. Either run this workflow from the Actions tab (Run workflow), which tags the
# commit it ran on with the version typed there, or with the version in Cargo.toml when the box is
# left empty, or push a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The website's download page links to these files by name through releases/latest/download/,
# so keep the names stable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, like v0.1.0. Leave empty to use the version in Cargo.toml."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  app:
    name: App for ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, target: universal-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then # the Arm Linux runner may not come with it
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install stable --profile minimal --target ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
          rustup default stable
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            # one file that runs natively on Apple silicon and Intel Macs
            cargo build --release --locked --target aarch64-apple-darwin
            cargo build --release --locked --target x86_64-apple-darwin
            mkdir -p target/universal-apple-darwin/release
            lipo -create -output target/universal-apple-darwin/release/lessgif \
              target/aarch64-apple-darwin/release/lessgif target/x86_64-apple-darwin/release/lessgif
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: Check it runs
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/lessgif
          "$bin" --version
          "$bin" tests/data/tiny.gif smoke.gif --quality 70
          test -s smoke.gif
      - name: Package
        shell: bash
        run: |
          name=lessgif-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp target/${{ matrix.target }}/release/lessgif.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/lessgif "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            lessgif-*.zip
            lessgif-*.tar.gz

  wasm:
    name: Browser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - run: sh web/build.sh
      - name: Package
        run: |
          mkdir lessgif-wasm
          cp web/lessgif.js web/lessgif.wasm LICENSE-MIT LICENSE-APACHE lessgif-wasm/
          zip -r lessgif-wasm.zip lessgif-wasm
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: lessgif-wasm.zip

  release:
    name: Publish the release
    needs: [app, wasm]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build record
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Pick the version
        id: version
        env:
          INPUT: ${{ inputs.version }}
        run: |
          input=$(printf '%s' "$INPUT" | tr -d '[:space:]')
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag=$GITHUB_REF_NAME
          elif [ -n "$input" ]; then tag=$input
          else tag=v$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          fi
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::The version should look like v0.1.0, not: $tag"; exit 1 ;; esac
          echo "::notice::Publishing lessgif $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Record how the files were built
        # A signed record, kept by GitHub, that each file was built by this workflow from this commit.
        # Anyone can check a download with: gh attestation verify <file> --repo <owner>/lessgif
        # GitHub keeps these records for public repositories only.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --target only matters when the tag doesn't exist yet (a run by hand): it tags this commit
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "lessgif $TAG" --generate-notes
