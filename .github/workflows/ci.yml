name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --all-targets
      - name: Library builds without the CLI dependencies
        run: cargo build --lib --no-default-features

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install 1.88 --profile minimal && rustup default 1.88
      - run: cargo build --lib --no-default-features

  wasm:
    name: WebAssembly matches native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sh web/build.sh
      - run: cargo build --release --example encode_raw
      - run: node web/test/identity.mjs web/lessgif.wasm target/release/examples/encode_raw
