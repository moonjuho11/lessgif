# Builds the website (site/) on every push, and publishes it from main when a host is set up:
#  - Cloudflare Pages: add the repository secrets CLOUDFLARE_API_TOKEN (a token with the
#    "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID, and the variable
#    CLOUDFLARE_PROJECT (the Pages project's name; the first run creates the project).
#  - GitHub Pages: set Settings > Pages > Source to "GitHub Actions" and add the repository
#    variable PAGES_DEPLOY with the value true.
# The variable SITE_URL sets the address used in links for search engines (default
# https://lessgif.com).
name: Website

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: sh web/build.sh
      - run: node site/test/unit.mjs
      - run: node site/build.mjs
        env:
          LESSGIF_BASE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  cloudflare:
    name: Publish to Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PROJECT != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: github-pages
      - run: mkdir dist && tar -xf artifact.tar -C dist
      - name: Deploy
        # wrangler is pinned to an exact version because this step holds the Cloudflare token;
        # Dependabot doesn't see it, so update it by hand
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          npx --yes wrangler@4.147.0 pages project list | grep -qw -- "$PROJECT" ||
            npx --yes wrangler@4.147.0 pages project create "$PROJECT" --production-branch main
          npx --yes wrangler@4.147.0 pages deploy dist --project-name "$PROJECT" --branch main

  github-pages:
    name: Publish to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
